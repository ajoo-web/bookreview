    /* ── Header ── */
    .header { max-width: 900px; margin: 0 auto; padding: 1.8rem 2rem 0; }
    .header h1 {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 2rem; color: #c9a84c;
      margin-bottom: 1rem; letter-spacing: 0.05em;
      text-shadow: 0 0 30px rgba(201,168,76,0.3);
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: rgba(8, 5, 2, 0.72);
      pointer-events: none; z-index: 0;
    }
    .header, .tabs-wrap, .page { position: relative; z-index: 1; }

    /* ── Tabs ── */
    .tabs-wrap { max-width: 900px; margin: 0 auto; padding: 0 2rem; }
    .tabs { display: flex; gap: 0; flex-wrap: wrap; }
    .tab-btn {
      padding: 0.55rem 1.4rem; border: 1px solid #6b5020; border-bottom: none;
      background: #1a1208; cursor: pointer;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.82rem; font-weight: bold; color: #c9a84c; border-radius: 8px 8px 0 0;
      margin-right: 4px; transition: all 0.2s; white-space: nowrap;
      letter-spacing: 0.04em;
    }
    .tab-btn.active { background: #1e1810; color: #c9a84c; border-color: #8b6914; }
    .tab-btn:hover:not(.active) { background: #231c10; color: #c9a84c; }

    /* ── Pages ── */
    .page { display: none; }
    .page.active { display: block; }
    .container {
      max-width: 900px; margin: 0 auto; padding: 2rem;
      background: #1e1810;
      border: 1px solid #6b5020;
      border-radius: 0 8px 8px 8px; min-height: 60vh;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.4), 0 4px 20px rgba(0,0,0,0.5);
    }

    /* ── Form ── */
    form { max-width: 100%; }
    label {
      display: block; font-size: 0.82rem; font-weight: bold;
      font-family: 'Cinzel', Georgia, serif;
      margin: 1rem 0 0.3rem; color: #d4b870; letter-spacing: 0.04em;
    }
    input[type=text], input[type=date], input[type=url], select, textarea {
      width: 100%; padding: 0.6rem 0.8rem;
      border: 1px solid #4a3818;
      border-radius: 4px; font-size: 0.95rem;
      font-family: 'IM Fell English', Georgia, serif;
      background: #141008; color: #e0cba8;
      transition: border-color 0.2s;
    }
    input[type=text]:focus, input[type=date]:focus, input[type=url]:focus,
    select:focus, textarea:focus {
      outline: none; border-color: #8b6914;
      box-shadow: 0 0 0 2px rgba(139,105,20,0.2);
    }
    select option { background: #141008; }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .stars { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 4px; margin-top: 0.3rem; }
    .stars input { display: none; }
    .stars label { font-size: 1.8rem; cursor: pointer; color: #3a3020; border: none; background: none; padding: 0; margin: 0; width: auto; transition: color 0.15s; }
    .stars input:checked ~ label,
    .stars label:hover,
    .stars label:hover ~ label { color: #c9a84c; }

    button[type="submit"] {
      margin-top: 1.5rem; width: 100%; padding: 0.8rem;
      background: #3d2e10; color: #c9a84c;
      font-size: 0.9rem; font-family: 'Cinzel', Georgia, serif;
      border: 1px solid #6b5020; border-radius: 4px;
      cursor: pointer; letter-spacing: 0.08em;
      transition: all 0.2s;
    }
    button[type="submit"]:hover { background: #5a4418; border-color: #c9a84c; }
    #status { text-align: center; margin-top: 0.8rem; font-size: 0.85rem; color: #8b9a6a; }
    #cover-preview { margin-top: 0.5rem; max-height: 140px; border-radius: 4px; display: none; border: 1px solid #4a3818; }

    /* ── Search ── */
    .search-wrap { margin-bottom: 1.5rem; }
    .search-wrap input {
      width: 100%; padding: 0.7rem 1rem; border-radius: 4px;
      border: 1px solid #4a3818; font-size: 0.95rem;
      font-family: 'IM Fell English', Georgia, serif;
      background: #141008; color: #e0cba8;
    }
    .search-wrap input:focus { outline: none; border-color: #8b6914; }
    .search-wrap input::placeholder { color: #5a4a30; }

    /* ── Review Cards ── */
    h2 {
      font-family: 'Cinzel', Georgia, serif;
      color: #c9a84c; margin-bottom: 1.2rem;
      font-size: 1.2rem; letter-spacing: 0.05em;
    }
    .review-card {
      position: relative; background: #161008;
      border-radius: 4px;
      padding: 1.4rem 4rem 1.4rem 1.4rem;
      margin-bottom: 1.2rem;
      border: 1px solid #3a2e14;
      border-left: 3px solid #6b5020;
    }
    .review-card h3 { font-size: 1.1rem; color: #d4b870; font-family: 'Cinzel', Georgia, serif; }
    .review-card .meta { font-size: 0.8rem; color: #6a5838; margin: 0.3rem 0 0.6rem; font-style: italic; }
    .review-card .stars-display { color: #c9a84c; font-size: 1rem; margin-bottom: 0.5rem; }
    .review-card p { font-size: 0.92rem; margin-top: 0.5rem; line-height: 1.7; color: #c8b48a; white-space: pre-wrap; }
    .review-card blockquote {
      border-left: 2px solid #6b5020; padding-left: 1rem;
      margin-top: 0.7rem; font-style: italic; color: #8a7450; font-size: 0.9rem;
    }
    .card-actions { position: absolute; top: 0.9rem; right: 0.9rem; display: flex; gap: 0.4rem; }
    .icon-btn { background: none; border: none; cursor: pointer; font-size: 1rem; color: #4a3818; padding: 2px 4px; transition: color 0.2s; }
    .icon-btn:hover { color: #c9a84c; }
    .icon-btn.del:hover { color: #8b3a2a; }

    mark { background: rgba(201,168,76,0.25); color: #f0e6cc; border-radius: 2px; padding: 0 2px; }

    /* ── Pagination ── */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-top: 1.5rem; flex-wrap: wrap; }
    .pagination button {
      padding: 0.35rem 0.8rem; border: 1px solid #4a3818; background: #161008;
      border-radius: 3px; cursor: pointer;
      font-family: 'Cinzel', Georgia, serif; font-size: 0.78rem;
      color: #a08040; letter-spacing: 0.04em;
    }
    .pagination button.active { background: #3d2e10; color: #c9a84c; border-color: #8b6914; }
    .pagination button:disabled { opacity: 0.3; cursor: default; }
    .pagination button:not(:disabled):hover { border-color: #8b6914; color: #c9a84c; }

    /* ── Edit Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      z-index: 1000; justify-content: center; align-items: flex-start; padding: 2rem 1rem; overflow-y: auto;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1e1810; border-radius: 6px; padding: 2rem; width: 100%; max-width: 620px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7); position: relative;
      border: 1px solid #6b5020;
    }
    .modal h3 { color: #c9a84c; margin-bottom: 1rem; font-size: 1.2rem; font-family: 'Cinzel', Georgia, serif; letter-spacing: 0.05em; }
    .modal label { display: block; font-size: 0.8rem; font-family: 'Cinzel', Georgia, serif; font-weight: bold; margin: 0.8rem 0 0.25rem; color: #d4b870; letter-spacing: 0.04em; }
    .modal input[type=text], .modal input[type=date], .modal input[type=url], .modal select, .modal textarea {
      width: 100%; padding: 0.55rem 0.75rem; border: 1px solid #4a3818;
      border-radius: 4px; font-size: 0.95rem; font-family: 'IM Fell English', Georgia, serif;
      background: #141008; color: #e0cba8;
    }
    .modal textarea { resize: vertical; min-height: 70px; }
    .modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .modal-actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
    .modal-actions button {
      flex: 1; padding: 0.75rem; border-radius: 4px;
      font-size: 0.85rem; font-family: 'Cinzel', Georgia, serif;
      cursor: pointer; letter-spacing: 0.05em;
    }
    .btn-save { background: #3d2e10; color: #c9a84c; border: 1px solid #6b5020; }
    .btn-save:hover { background: #5a4418; }
    .btn-cancel { background: #1a1208; color: #6a5838; border: 1px solid #3a2e14; }
    .btn-cancel:hover { color: #a08040; }
    .modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #4a3818; }
    .modal-close:hover { color: #c9a84c; }

    /* ── Gallery ── */
    .gallery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; margin-top: 1rem; }
    .gallery-cell {
      aspect-ratio: 2/3; border-radius: 4px; overflow: hidden;
      border: 1px dashed #3a2e14; background: #141008;
      display: flex; align-items: center; justify-content: center; position: relative;
    }
    .gallery-cell.filled { border: 1px solid #3a2e14; cursor: pointer; }
    .gallery-cell.filled:hover { border-color: #8b6914; }
    .gallery-cell img { width: 100%; height: 100%; object-fit: cover; border-radius: 3px; transition: transform 0.2s; }
    .gallery-cell.filled:hover img { transform: scale(1.04); }
    .gallery-cell .cell-title {
      font-family: 'IM Fell English', Georgia, serif;
      font-size: 0.72rem; color: #a08040;
      text-align: center; padding: 0.5rem; line-height: 1.4;
    }
    .gallery-cell .cell-empty { color: #2a2010; font-size: 1.2rem; }
    .gallery-cell-tooltip {
      display: none; position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(15,10,4,0.88); color: #c9a84c; font-size: 0.68rem;
      padding: 0.3rem 0.4rem; text-align: center;
      font-family: 'IM Fell English', Georgia, serif; font-style: italic;
    }
    .gallery-cell.filled:hover .gallery-cell-tooltip { display: block; }

    /* ── Gallery Popout ── */
    .gpop-overlay {
      display: none; position: fixed; inset: 0;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      background: rgba(0,0,0,0.7);
      z-index: 2000; justify-content: center; align-items: center; padding: 1.5rem;
    }
    .gpop-overlay.open { display: flex; }
    .gpop {
      background: #1e1810; border-radius: 6px; padding: 2rem;
      max-width: 540px; width: 100%; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 12px 50px rgba(0,0,0,0.8); position: relative;
      border: 1px solid #6b5020;
    }
    .gpop img { width: 100%; max-height: 180px; object-fit: contain; border-radius: 4px; margin-bottom: 1rem; }
    .gpop h3 { color: #d4b870; font-size: 1.2rem; margin-bottom: 0.3rem; font-family: 'Cinzel', Georgia, serif; }
    .gpop .meta { font-size: 0.8rem; color: #6a5838; margin-bottom: 0.6rem; font-style: italic; }
    .gpop .stars-display { color: #c9a84c; margin-bottom: 0.8rem; }
    .gpop p { font-size: 0.92rem; line-height: 1.7; white-space: pre-wrap; margin-top: 0.5rem; color: #c8b48a; }
    .gpop blockquote { border-left: 2px solid #6b5020; padding-left: 1rem; margin-top: 0.6rem; font-style: italic; color: #8a7450; font-size: 0.9rem; }
    .gpop-close { position: absolute; top: 0.9rem; right: 0.9rem; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #4a3818; }
    .gpop-close:hover { color: #c9a84c; }
    .gallery-cell.filled { cursor: pointer; }

    #no-reviews { color: #4a3818; font-style: italic; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f0c08; }
    ::-webkit-scrollbar-thumb { background: #3a2e14; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #6b5020; }

    /* ───────── v2 additions ───────── */
    .sync-status { font-size: 0.75rem; color: #6a5838; font-style: italic; margin: -0.6rem 0 0.8rem; min-height: 1em; }
    .sync-status.pending { color: #b8863a; }
    .sync-status.ok { color: #8b9a6a; }

    .tab-btn:focus-visible, button:focus-visible, select:focus-visible, .gallery-cell:focus-visible { outline: 2px solid #c9a84c; outline-offset: 2px; }

    /* keep star radios keyboard-reachable (was display:none) */
    .stars { position: relative; }
    .stars input { display: block; position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
    .stars input:focus-visible + label { outline: 2px solid #c9a84c; border-radius: 3px; }

    .inline { display: flex; gap: 0.5rem; align-items: stretch; }
    .inline input { flex: 1; min-width: 0; }
    .btn-secondary {
      background: #1a1208; color: #c9a84c; border: 1px solid #4a3818; border-radius: 4px;
      padding: 0.45rem 0.9rem; font-family: 'Cinzel', Georgia, serif; font-size: 0.74rem;
      letter-spacing: 0.04em; white-space: nowrap; transition: all 0.2s;
    }
    .btn-secondary:hover { border-color: #8b6914; background: #231c10; }
    .btn-secondary:disabled { opacity: 0.5; }
    .hint { font-size: 0.78rem; color: #6a5838; font-style: italic; margin-top: 0.3rem; min-height: 1em; }
    .opt { font-weight: normal; color: #7a6a48; }

    .toolbar { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .toolbar select { width: auto; flex: 1 1 150px; padding: 0.45rem 0.6rem; font-size: 0.85rem; }
    .result-count { font-size: 0.8rem; color: #6a5838; font-style: italic; margin-bottom: 0.8rem; }
    .review-card .cover { max-height: 100px; border-radius: 6px; margin-bottom: 0.6rem; border: 1px solid #3a2e14; display: block; }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.8rem; margin-bottom: 1.6rem; }
    .stat { background: #161008; border: 1px solid #3a2e14; border-radius: 4px; padding: 1rem; text-align: center; }
    .stat b { display: block; font-family: 'Cinzel', Georgia, serif; font-size: 1.6rem; color: #c9a84c; }
    .stat span { font-size: 0.78rem; color: #8a7450; }
    .stats-section { margin-bottom: 1.6rem; }
    .stats-section h3 { font-family: 'Cinzel', Georgia, serif; color: #d4b870; font-size: 0.95rem; margin-bottom: 0.6rem; letter-spacing: 0.04em; }
    .bar-row { display: flex; align-items: center; gap: 0.6rem; margin: 0.35rem 0; font-size: 0.85rem; }
    .bar-label { width: 6rem; flex: none; color: #a08040; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { flex: 1; min-width: 0; }
    .bar { height: 12px; background: #6b5020; border-radius: 2px; min-width: 2px; }
    .bar-count { color: #c8b48a; width: 2rem; flex: none; }
    .data-tools { display: flex; gap: 0.6rem; flex-wrap: wrap; border-top: 1px solid #3a2e14; padding-top: 1.2rem; }
    .gallery-count { font-family: 'IM Fell English', Georgia, serif; font-size: 0.85rem; color: #8a7450; font-style: italic; margin-left: 0.5rem; }

    @media (max-width: 640px) {
      .header { padding: 1.2rem 1rem 0; }
      .header h1 { font-size: 1.4rem; }
      .tabs-wrap { padding: 0 0.5rem; }
      .tabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 1px; }
      .container { padding: 1rem; }
      .row, .modal .row { grid-template-columns: 1fr; gap: 0; }
      .gallery-grid { grid-template-columns: repeat(3, 1fr); }
      .modal { padding: 1.2rem; }
      .gpop { padding: 1.2rem; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>📜My Book Reviews🕰</h1>
    <div class="sync-status" id="syncStatus" role="status" aria-live="polite"></div>
  </div>

  <div class="tabs-wrap">
    <div class="tabs" id="tabsBar" role="tablist">
      <button class="tab-btn active" role="tab" aria-selected="true" data-tab="home">Home</button>
      <button class="tab-btn" role="tab" aria-selected="false" data-tab="reviews">All Reviews</button>
      <button class="tab-btn" role="tab" aria-selected="false" data-tab="stats">Stats</button>
    </div>
  </div>

  <!-- Home Page -->
  <div id="home" class="page active">
    <div class="container">
      <form id="reviewForm">
        <label for="f-title">Title</label>
        <input type="text" id="f-title" name="Title" required placeholder="e.g. Pride and Prejudice" />

        <label for="coverURLInput">Book Cover Image URL <span class="opt">(optional)</span></label>
        <div class="inline">
          <input type="url" name="CoverURL" id="coverURLInput" placeholder="https://..." />
          <button type="button" class="btn-secondary" id="findCoverBtn">🔎 Find cover</button>
        </div>
        <div class="hint" id="coverHint"></div>
        <img id="cover-preview" alt="Cover preview" />

        <label for="f-author">Author</label>
        <input type="text" id="f-author" name="Author" required placeholder="e.g. Jane Austen" />

        <label id="rating-label">Rating</label>
        <div class="stars" role="radiogroup" aria-labelledby="rating-label">
          <input type="radio" name="Rating" id="s5" value="⭐⭐⭐⭐⭐"/><label for="s5" title="5 stars">★</label>
          <input type="radio" name="Rating" id="s4" value="⭐⭐⭐⭐"/><label for="s4" title="4 stars">★</label>
          <input type="radio" name="Rating" id="s3" value="⭐⭐⭐"/><label for="s3" title="3 stars">★</label>
          <input type="radio" name="Rating" id="s2" value="⭐⭐"/><label for="s2" title="2 stars">★</label>
          <input type="radio" name="Rating" id="s1" value="⭐"/><label for="s1" title="1 star">★</label>
        </div>

        <label for="f-format">Format</label>
        <select id="f-format" name="Format">
          <option value="Print">📖 Print</option>
          <option value="Audio">🎧 Audiobook</option>
          <option value="eBook">📱 eBook</option>
        </select>

        <div class="row">
          <div><label for="f-start">Start Date</label><input id="f-start" name="Start Date" type="date"/></div>
          <div><label for="f-end">End Date</label><input id="f-end" name="End Date" type="date"/></div>
        </div>

        <label for="f-summary">Summary</label>
        <textarea id="f-summary" name="Summary" placeholder="What is the book about?"></textarea>

        <label for="f-thoughts">My Thoughts</label>
        <textarea id="f-thoughts" name="Thoughts" placeholder="Your personal reflection..."></textarea>

        <label for="f-quotes">Favorite Quotes <span class="opt">(wrap each quote in " ")</span></label>
        <textarea id="f-quotes" name="Quotes" placeholder='"Quote one here"
"Quote two here"' style="min-height:120px;"></textarea>

        <button type="submit">Save Review</button>
        <div id="status" role="status" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <!-- All Reviews Page -->
  <div id="reviews" class="page">
    <div class="container">
      <div class="search-wrap">
        <input type="text" id="searchInput" aria-label="Search reviews" placeholder="🔍 Search by title, author, or keyword..." />
      </div>
      <div class="toolbar">
        <select id="sortSelect" aria-label="Sort reviews">
          <option value="newest">Sort: Newest added</option>
          <option value="oldest">Sort: Oldest added</option>
          <option value="finished">Sort: Recently finished</option>
          <option value="high">Sort: Highest rated</option>
          <option value="low">Sort: Lowest rated</option>
          <option value="title">Sort: Title A–Z</option>
        </select>
        <select id="ratingFilter" aria-label="Filter by rating">
          <option value="">Any rating</option>
          <option value="5">⭐⭐⭐⭐⭐</option>
          <option value="4">⭐⭐⭐⭐</option>
          <option value="3">⭐⭐⭐</option>
          <option value="2">⭐⭐</option>
          <option value="1">⭐</option>
          <option value="0">Unrated</option>
        </select>
        <select id="formatFilter" aria-label="Filter by format">
          <option value="">Any format</option>
          <option value="Print">📖 Print</option>
          <option value="Audio">🎧 Audiobook</option>
          <option value="eBook">📱 eBook</option>
        </select>
      </div>
      <div class="result-count" id="resultCount"></div>
      <div id="reviews-list"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <!-- Stats Page -->
  <div id="stats" class="page">
    <div class="container">
      <h2>Reading Stats</h2>
      <div id="statsBody"></div>
      <div class="data-tools">
        <button type="button" class="btn-secondary" id="exportBtn">⬇ Export backup (JSON)</button>
        <button type="button" class="btn-secondary" id="importBtn">⬆ Import backup</button>
        <button type="button" class="btn-secondary" id="refreshBtn">↻ Refresh from Sheet</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden />
      </div>
      <div class="hint" id="dataHint"></div>
    </div>
  </div>

  <!-- Year pages injected dynamically -->
  <div id="yearPages"></div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editHeading">
      <button class="modal-close" id="editClose" aria-label="Close">✕</button>
      <h3 id="editHeading">✏️ Edit Review</h3>
      <input type="hidden" id="edit-id" />
      <label for="edit-Title">Title</label><input type="text" id="edit-Title" />
      <label for="edit-CoverURL">Book Cover Image URL</label>
      <div class="inline">
        <input type="url" id="edit-CoverURL" />
        <button type="button" class="btn-secondary" id="editFindCoverBtn">🔎 Find cover</button>
      </div>
      <div class="hint" id="editCoverHint"></div>
      <label for="edit-Author">Author</label><input type="text" id="edit-Author" />
      <label id="edit-rating-label">Rating</label>
      <div class="stars" id="edit-stars" role="radiogroup" aria-labelledby="edit-rating-label">
        <input type="radio" name="editRating" id="es5" value="⭐⭐⭐⭐⭐"/><label for="es5" title="5 stars">★</label>
        <input type="radio" name="editRating" id="es4" value="⭐⭐⭐⭐"/><label for="es4" title="4 stars">★</label>
        <input type="radio" name="editRating" id="es3" value="⭐⭐⭐"/><label for="es3" title="3 stars">★</label>
        <input type="radio" name="editRating" id="es2" value="⭐⭐"/><label for="es2" title="2 stars">★</label>
        <input type="radio" name="editRating" id="es1" value="⭐"/><label for="es1" title="1 star">★</label>
      </div>
      <label for="edit-Format">Format</label>
      <select id="edit-Format">
        <option value="Print">📖 Print</option>
        <option value="Audio">🎧 Audiobook</option>
        <option value="eBook">📱 eBook</option>
      </select>
      <div class="row">
        <div><label for="edit-StartDate">Start Date</label><input type="date" id="edit-StartDate" /></div>
        <div><label for="edit-EndDate">End Date</label><input type="date" id="edit-EndDate" /></div>
      </div>
      <label for="edit-Summary">Summary</label><textarea id="edit-Summary"></textarea>
      <label for="edit-Thoughts">My Thoughts</label><textarea id="edit-Thoughts"></textarea>
      <label for="edit-Quotes">Favorite Quotes <span class="opt">(wrap each in " ")</span></label>
      <textarea id="edit-Quotes" style="min-height:100px;"></textarea>
      <div class="hint" id="editError" role="alert"></div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="editCancel">Cancel</button>
        <button type="button" class="btn-save" id="editSave">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Gallery popout -->
  <div class="gpop-overlay" id="gpopOverlay">
    <div class="gpop" id="gpopBox" role="dialog" aria-modal="true" aria-label="Review details">
      <button class="gpop-close" id="gpopClose" aria-label="Close">&#x2715;</button>
      <div id="gpopBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
