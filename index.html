<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📚 My Book Reviews</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background: #fdf8f2; color: #333; padding: 2rem; }
    h1 { text-align: center; font-size: 2rem; margin-bottom: 2rem; color: #5a3e2b; }
    .container { max-width: 700px; margin: 0 auto; }
    form { background: #fff; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 3rem; }
    label { display: block; font-size: 0.85rem; font-weight: bold; margin: 1rem 0 0.3rem; color: #5a3e2b; }
    input, select, textarea {
      width: 100%; padding: 0.6rem 0.8rem; border: 1px solid #ddd;
      border-radius: 8px; font-size: 1rem; font-family: inherit; background: #fafafa;
    }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .stars { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 4px; margin-top: 0.3rem; }
    .stars input { display: none; }
    .stars label {
      font-size: 1.8rem; cursor: pointer; color: #ccc;
      border: none; background: none; padding: 0; margin: 0; width: auto;
    }
    .stars input:checked ~ label,
    .stars label:hover,
    .stars label:hover ~ label { color: #f5a623; }
    button[type="submit"] {
      margin-top: 1.5rem; width: 100%; padding: 0.8rem;
      background: #5a3e2b; color: white; font-size: 1rem;
      border: none; border-radius: 8px; cursor: pointer; font-family: inherit;
    }
    button[type="submit"]:hover { background: #7a5c40; }
    #status { text-align: center; margin-top: 0.8rem; font-size: 0.9rem; color: green; }

    /* Reviews display */
    h2 { color: #5a3e2b; margin-bottom: 1rem; }
    .review-card {
      background: #fff; border-radius: 12px; padding: 1.5rem;
      margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .review-card h3 { font-size: 1.2rem; color: #5a3e2b; }
    .review-card .meta { font-size: 0.85rem; color: #888; margin: 0.3rem 0 0.8rem; }
    .review-card .stars-display { color: #f5a623; font-size: 1.1rem; }
    .review-card p { font-size: 0.95rem; margin-top: 0.5rem; line-height: 1.6; }
    .review-card blockquote {
      border-left: 3px solid #f5a623; padding-left: 1rem;
      margin-top: 0.8rem; font-style: italic; color: #666;
    }
    #no-reviews { color: #aaa; font-style: italic; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 My Book Reviews</h1>

    <form id="reviewForm">
      <label>Title</label>
      <input name="Title" required placeholder="e.g. Pride and Prejudice" />

      <label>Author</label>
      <input name="Author" required placeholder="e.g. Jane Austen" />

      <label>Rating</label>
      <div class="stars">
        <input type="radio" name="Rating" id="s5" value="⭐⭐⭐⭐⭐"/><label for="s5">★</label>
        <input type="radio" name="Rating" id="s4" value="⭐⭐⭐⭐"/><label for="s4">★</label>
        <input type="radio" name="Rating" id="s3" value="⭐⭐⭐"/><label for="s3">★</label>
        <input type="radio" name="Rating" id="s2" value="⭐⭐"/><label for="s2">★</label>
        <input type="radio" name="Rating" id="s1" value="⭐"/><label for="s1">★</label>
      </div>

      <label>Format</label>
      <select name="Format">
        <option value="Print">📖 Print</option>
        <option value="Audio">🎧 Audiobook</option>
        <option value="eBook">📱 eBook</option>
      </select>

      <div class="row">
        <div><label>Start Date</label><input name="Start Date" type="date"/></div>
        <div><label>End Date</label><input name="End Date" type="date"/></div>
      </div>

      <label>Summary</label>
      <textarea name="Summary" placeholder="What is the book about?"></textarea>

      <label>My Thoughts</label>
      <textarea name="Thoughts" placeholder="Your personal reflection..."></textarea>

      <label>Favorite Quotes</label>
      <textarea name="Quotes" placeholder="Notable passages..."></textarea>

      <button type="submit">Save Review</button>
      <div id="status"></div>
    </form>

    <h2>All Reviews</h2>
    <div id="reviews-list"><p id="no-reviews">No reviews yet. Add your first one above!</p></div>
  </div>

  <script>
    const SCRIPT_URL = 'YOUR_APPS_SCRIPT_URL';

    function renderReviews() {
      const reviews = JSON.parse(localStorage.getItem('bookReviews') || '[]');
      const container = document.getElementById('reviews-list');
      if (reviews.length === 0) {
        container.innerHTML = '<p id="no-reviews">No reviews yet. Add your first one above!</p>';
        return;
      }
      container.innerHTML = reviews.slice().reverse().map(r => `
        <div class="review-card">
          <h3>${r.Title}</h3>
          <div class="meta">by ${r.Author} &nbsp;·&nbsp; ${r.Format} &nbsp;·&nbsp; ${r['Start Date'] || '?'} → ${r['End Date'] || '?'}</div>
          <div class="stars-display">${r.Rating || ''}</div>
          ${r.Summary ? `<p><strong>Summary:</strong> ${r.Summary}</p>` : ''}
          ${r.Thoughts ? `<p><strong>Thoughts:</strong> ${r.Thoughts}</p>` : ''}
          ${r.Quotes ? `<blockquote>${r.Quotes}</blockquote>` : ''}
        </div>
      `).join('');
    }

    document.getElementById('reviewForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const status = document.getElementById('status');
      const data = new FormData(this);
      const entry = Object.fromEntries(data.entries());

      // Save locally
      const reviews = JSON.parse(localStorage.getItem('bookReviews') || '[]');
      reviews.push(entry);
      localStorage.setItem('bookReviews', JSON.stringify(reviews));
      renderReviews();

      // Send to Google Sheets (no-cors bypasses CORS preflight)
      fetch(SCRIPT_URL, { method: 'POST', body: data, mode: 'no-cors' })
        .then(() => { status.textContent = '✅ Review saved to Sheets!'; })
        .catch(() => { status.textContent = '⚠️ Saved locally. Sheets sync failed.'; });

      this.reset();
      status.textContent = '💾 Saving...';
    });

    renderReviews();
  </script>
</body>
</html>
