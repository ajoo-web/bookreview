    /* ── Header ── */
    .header { max-width: 900px; margin: 0 auto; padding: 1.8rem 2rem 0; }
    .header h1 {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 2rem; color: #c9a84c;
      margin-bottom: 1rem; letter-spacing: 0.05em;
      text-shadow: 0 0 30px rgba(201,168,76,0.3);
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: rgba(8, 5, 2, 0.72);
      pointer-events: none; z-index: 0;
    }
    .header, .tabs-wrap, .page { position: relative; z-index: 1; }

    /* ── Tabs ── */
    .tabs-wrap { max-width: 900px; margin: 0 auto; padding: 0 2rem; }
    .tabs { display: flex; gap: 0; flex-wrap: wrap; }
    .tab-btn {
      padding: 0.55rem 1.4rem; border: 1px solid #6b5020; border-bottom: none;
      background: #1a1208; cursor: pointer;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.82rem; font-weight: bold; color: #c9a84c; border-radius: 8px 8px 0 0;
      margin-right: 4px; transition: all 0.2s; white-space: nowrap;
      letter-spacing: 0.04em;
    }
    .tab-btn.active { background: #1e1810; color: #c9a84c; border-color: #8b6914; }
    .tab-btn:hover:not(.active) { background: #231c10; color: #c9a84c; }

    /* ── Pages ── */
    .page { display: none; }
    .page.active { display: block; }
    .container {
      max-width: 900px; margin: 0 auto; padding: 2rem;
      background: #1e1810;
      border: 1px solid #6b5020;
      border-radius: 0 8px 8px 8px; min-height: 60vh;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.4), 0 4px 20px rgba(0,0,0,0.5);
    }

    /* ── Form ── */
    form { max-width: 100%; }
    label {
      display: block; font-size: 0.82rem; font-weight: bold;
      font-family: 'Cinzel', Georgia, serif;
      margin: 1rem 0 0.3rem; color: #d4b870; letter-spacing: 0.04em;
    }
    input[type=text], input[type=date], input[type=url], select, textarea {
      width: 100%; padding: 0.6rem 0.8rem;
      border: 1px solid #4a3818;
      border-radius: 4px; font-size: 0.95rem;
      font-family: 'IM Fell English', Georgia, serif;
      background: #141008; color: #e0cba8;
      transition: border-color 0.2s;
    }
    input[type=text]:focus, input[type=date]:focus, input[type=url]:focus,
    select:focus, textarea:focus {
      outline: none; border-color: #8b6914;
      box-shadow: 0 0 0 2px rgba(139,105,20,0.2);
    }
    select option { background: #141008; }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .stars { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 4px; margin-top: 0.3rem; }
    .stars input { display: none; }
    .stars label { font-size: 1.8rem; cursor: pointer; color: #3a3020; border: none; background: none; padding: 0; margin: 0; width: auto; transition: color 0.15s; }
    .stars input:checked ~ label,
    .stars label:hover,
    .stars label:hover ~ label { color: #c9a84c; }

    button[type="submit"] {
      margin-top: 1.5rem; width: 100%; padding: 0.8rem;
      background: #3d2e10; color: #c9a84c;
      font-size: 0.9rem; font-family: 'Cinzel', Georgia, serif;
      border: 1px solid #6b5020; border-radius: 4px;
      cursor: pointer; letter-spacing: 0.08em;
      transition: all 0.2s;
    }
    button[type="submit"]:hover { background: #5a4418; border-color: #c9a84c; }
    #status { text-align: center; margin-top: 0.8rem; font-size: 0.85rem; color: #8b9a6a; }
    #cover-preview { margin-top: 0.5rem; max-height: 140px; border-radius: 4px; display: none; border: 1px solid #4a3818; }

    /* ── Search ── */
    .search-wrap { margin-bottom: 1.5rem; }
    .search-wrap input {
      width: 100%; padding: 0.7rem 1rem; border-radius: 4px;
      border: 1px solid #4a3818; font-size: 0.95rem;
      font-family: 'IM Fell English', Georgia, serif;
      background: #141008; color: #e0cba8;
    }
    .search-wrap input:focus { outline: none; border-color: #8b6914; }
    .search-wrap input::placeholder { color: #5a4a30; }

    /* ── Review Cards ── */
    h2 {
      font-family: 'Cinzel', Georgia, serif;
      color: #c9a84c; margin-bottom: 1.2rem;
      font-size: 1.2rem; letter-spacing: 0.05em;
    }
    .review-card {
      position: relative; background: #161008;
      border-radius: 4px;
      padding: 1.4rem 4rem 1.4rem 1.4rem;
      margin-bottom: 1.2rem;
      border: 1px solid #3a2e14;
      border-left: 3px solid #6b5020;
    }
    .review-card h3 { font-size: 1.1rem; color: #d4b870; font-family: 'Cinzel', Georgia, serif; }
    .review-card .meta { font-size: 0.8rem; color: #6a5838; margin: 0.3rem 0 0.6rem; font-style: italic; }
    .review-card .stars-display { color: #c9a84c; font-size: 1rem; margin-bottom: 0.5rem; }
    .review-card p { font-size: 0.92rem; margin-top: 0.5rem; line-height: 1.7; color: #c8b48a; white-space: pre-wrap; }
    .review-card blockquote {
      border-left: 2px solid #6b5020; padding-left: 1rem;
      margin-top: 0.7rem; font-style: italic; color: #8a7450; font-size: 0.9rem;
    }
    .card-actions { position: absolute; top: 0.9rem; right: 0.9rem; display: flex; gap: 0.4rem; }
    .icon-btn { background: none; border: none; cursor: pointer; font-size: 1rem; color: #4a3818; padding: 2px 4px; transition: color 0.2s; }
    .icon-btn:hover { color: #c9a84c; }
    .icon-btn.del:hover { color: #8b3a2a; }

    mark { background: rgba(201,168,76,0.25); color: #f0e6cc; border-radius: 2px; padding: 0 2px; }

    /* ── Pagination ── */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-top: 1.5rem; flex-wrap: wrap; }
    .pagination button {
      padding: 0.35rem 0.8rem; border: 1px solid #4a3818; background: #161008;
      border-radius: 3px; cursor: pointer;
      font-family: 'Cinzel', Georgia, serif; font-size: 0.78rem;
      color: #a08040; letter-spacing: 0.04em;
    }
    .pagination button.active { background: #3d2e10; color: #c9a84c; border-color: #8b6914; }
    .pagination button:disabled { opacity: 0.3; cursor: default; }
    .pagination button:not(:disabled):hover { border-color: #8b6914; color: #c9a84c; }

    /* ── Edit Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      z-index: 1000; justify-content: center; align-items: flex-start; padding: 2rem 1rem; overflow-y: auto;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1e1810; border-radius: 6px; padding: 2rem; width: 100%; max-width: 620px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7); position: relative;
      border: 1px solid #6b5020;
    }
    .modal h3 { color: #c9a84c; margin-bottom: 1rem; font-size: 1.2rem; font-family: 'Cinzel', Georgia, serif; letter-spacing: 0.05em; }
    .modal label { display: block; font-size: 0.8rem; font-family: 'Cinzel', Georgia, serif; font-weight: bold; margin: 0.8rem 0 0.25rem; color: #d4b870; letter-spacing: 0.04em; }
    .modal input[type=text], .modal input[type=date], .modal input[type=url], .modal select, .modal textarea {
      width: 100%; padding: 0.55rem 0.75rem; border: 1px solid #4a3818;
      border-radius: 4px; font-size: 0.95rem; font-family: 'IM Fell English', Georgia, serif;
      background: #141008; color: #e0cba8;
    }
    .modal textarea { resize: vertical; min-height: 70px; }
    .modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .modal-actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
    .modal-actions button {
      flex: 1; padding: 0.75rem; border-radius: 4px;
      font-size: 0.85rem; font-family: 'Cinzel', Georgia, serif;
      cursor: pointer; letter-spacing: 0.05em;
    }
    .btn-save { background: #3d2e10; color: #c9a84c; border: 1px solid #6b5020; }
    .btn-save:hover { background: #5a4418; }
    .btn-cancel { background: #1a1208; color: #6a5838; border: 1px solid #3a2e14; }
    .btn-cancel:hover { color: #a08040; }
    .modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #4a3818; }
    .modal-close:hover { color: #c9a84c; }

    /* ── Gallery ── */
    .gallery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; margin-top: 1rem; }
    .gallery-cell {
      aspect-ratio: 2/3; border-radius: 4px; overflow: hidden;
      border: 1px dashed #3a2e14; background: #141008;
      display: flex; align-items: center; justify-content: center; position: relative;
    }
    .gallery-cell.filled { border: 1px solid #3a2e14; cursor: pointer; }
    .gallery-cell.filled:hover { border-color: #8b6914; }
    .gallery-cell img { width: 100%; height: 100%; object-fit: cover; border-radius: 3px; transition: transform 0.2s; }
    .gallery-cell.filled:hover img { transform: scale(1.04); }
    .gallery-cell .cell-title {
      font-family: 'IM Fell English', Georgia, serif;
      font-size: 0.72rem; color: #a08040;
      text-align: center; padding: 0.5rem; line-height: 1.4;
    }
    .gallery-cell .cell-empty { color: #2a2010; font-size: 1.2rem; }
    .gallery-cell-tooltip {
      display: none; position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(15,10,4,0.88); color: #c9a84c; font-size: 0.68rem;
      padding: 0.3rem 0.4rem; text-align: center;
      font-family: 'IM Fell English', Georgia, serif; font-style: italic;
    }
    .gallery-cell.filled:hover .gallery-cell-tooltip { display: block; }

    /* ── Gallery Popout ── */
    .gpop-overlay {
      display: none; position: fixed; inset: 0;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      background: rgba(0,0,0,0.7);
      z-index: 2000; justify-content: center; align-items: center; padding: 1.5rem;
    }
    .gpop-overlay.open { display: flex; }
    .gpop {
      background: #1e1810; border-radius: 6px; padding: 2rem;
      max-width: 540px; width: 100%; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 12px 50px rgba(0,0,0,0.8); position: relative;
      border: 1px solid #6b5020;
    }
    .gpop img { width: 100%; max-height: 180px; object-fit: contain; border-radius: 4px; margin-bottom: 1rem; }
    .gpop h3 { color: #d4b870; font-size: 1.2rem; margin-bottom: 0.3rem; font-family: 'Cinzel', Georgia, serif; }
    .gpop .meta { font-size: 0.8rem; color: #6a5838; margin-bottom: 0.6rem; font-style: italic; }
    .gpop .stars-display { color: #c9a84c; margin-bottom: 0.8rem; }
    .gpop p { font-size: 0.92rem; line-height: 1.7; white-space: pre-wrap; margin-top: 0.5rem; color: #c8b48a; }
    .gpop blockquote { border-left: 2px solid #6b5020; padding-left: 1rem; margin-top: 0.6rem; font-style: italic; color: #8a7450; font-size: 0.9rem; }
    .gpop-close { position: absolute; top: 0.9rem; right: 0.9rem; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #4a3818; }
    .gpop-close:hover { color: #c9a84c; }
    .gallery-cell.filled { cursor: pointer; }

    #no-reviews { color: #4a3818; font-style: italic; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f0c08; }
    ::-webkit-scrollbar-thumb { background: #3a2e14; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #6b5020; }
  </style>

<body>

  <div class="header">
    <h1>📚 My Book Reviews</h1>
  </div>

  <div class="tabs-wrap">
    <div class="tabs" id="tabsBar">
      <button class="tab-btn active" data-tab="home" onclick="showTab('home', this)">Home</button>
      <button class="tab-btn" data-tab="reviews" onclick="showTab('reviews', this)">All Reviews</button>
    </div>
  </div>

  <!-- Home Page -->
  <div id="home" class="page active">
    <div class="container">
      <form id="reviewForm">
        <label>Title</label>
        <input type="text" name="Title" required placeholder="e.g. Pride and Prejudice" />

        <label>Book Cover Image URL <span style="font-weight:normal;color:#aaa">(optional)</span></label>
        <input type="url" name="CoverURL" id="coverURLInput" placeholder="https://..." oninput="previewCover(this.value)" />
        <img id="cover-preview" alt="Cover preview" />

        <label>Author</label>
        <input type="text" name="Author" required placeholder="e.g. Jane Austen" />

        <label>Rating</label>
        <div class="stars">
          <input type="radio" name="Rating" id="s5" value="⭐⭐⭐⭐⭐"/><label for="s5">★</label>
          <input type="radio" name="Rating" id="s4" value="⭐⭐⭐⭐"/><label for="s4">★</label>
          <input type="radio" name="Rating" id="s3" value="⭐⭐⭐"/><label for="s3">★</label>
          <input type="radio" name="Rating" id="s2" value="⭐⭐"/><label for="s2">★</label>
          <input type="radio" name="Rating" id="s1" value="⭐"/><label for="s1">★</label>
        </div>

        <label>Format</label>
        <select name="Format">
          <option value="Print">📖 Print</option>
          <option value="Audio">🎧 Audiobook</option>
          <option value="eBook">📱 eBook</option>
        </select>

        <div class="row">
          <div><label>Start Date</label><input name="Start Date" type="date"/></div>
          <div><label>End Date</label><input name="End Date" type="date"/></div>
        </div>

        <label>Summary</label>
        <textarea name="Summary" placeholder="What is the book about?"></textarea>

        <label>My Thoughts</label>
        <textarea name="Thoughts" placeholder="Your personal reflection..."></textarea>

        <label>Favorite Quotes <span style="font-weight:normal;color:#aaa">(wrap each quote in " ")</span></label>
        <textarea name="Quotes" placeholder='"Quote one here"
"Quote two here"' style="min-height:120px;"></textarea>

        <button type="submit">Save Review</button>
        <div id="status"></div>
      </form>
    </div>
  </div>

  <!-- All Reviews Page -->
  <div id="reviews" class="page">
    <div class="container">
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="🔍 Search by title, author, or keyword..." oninput="onSearch()" />
      </div>
      <div id="reviews-list"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <!-- Year pages injected dynamically -->

  <!-- Edit Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h3>✏️ Edit Review</h3>
      <input type="hidden" id="edit-idx" />
      <label>Title</label><input type="text" id="edit-Title" />
      <label>Book Cover Image URL</label><input type="url" id="edit-CoverURL" />
      <label>Author</label><input type="text" id="edit-Author" />
      <label>Rating</label>
      <div class="stars" id="edit-stars">
        <input type="radio" name="editRating" id="es5" value="⭐⭐⭐⭐⭐"/><label for="es5">★</label>
        <input type="radio" name="editRating" id="es4" value="⭐⭐⭐⭐"/><label for="es4">★</label>
        <input type="radio" name="editRating" id="es3" value="⭐⭐⭐"/><label for="es3">★</label>
        <input type="radio" name="editRating" id="es2" value="⭐⭐"/><label for="es2">★</label>
        <input type="radio" name="editRating" id="es1" value="⭐"/><label for="es1">★</label>
      </div>
      <label>Format</label>
      <select id="edit-Format">
        <option value="Print">📖 Print</option>
        <option value="Audio">🎧 Audiobook</option>
        <option value="eBook">📱 eBook</option>
      </select>
      <div class="row">
        <div><label>Start Date</label><input type="date" id="edit-StartDate" /></div>
        <div><label>End Date</label><input type="date" id="edit-EndDate" /></div>
      </div>
      <label>Summary</label><textarea id="edit-Summary"></textarea>
      <label>My Thoughts</label><textarea id="edit-Thoughts"></textarea>
      <label>Favorite Quotes <span style="font-weight:normal;color:#aaa">(wrap each in " ")</span></label>
      <textarea id="edit-Quotes" style="min-height:100px;"></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" onclick="saveEdit()">Save & Sync to Sheets</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxoYnHVYOTRg3ttWnFkitldJYy694xSjqOgn_4veQq657d44vpqfI-oyFWKJka5WSgzSA/exec';
    const PER_PAGE = 3;
    let currentPage = 1;
    let searchQuery = '';
    let activeTab = 'home';

    // ── Cover preview ──
    function previewCover(url) {
      const img = document.getElementById('cover-preview');
      if (url) { img.src = url; img.style.display = 'block'; }
      else { img.style.display = 'none'; }
    }

    // ── Year tabs ──
    function getYearsFromReviews() {
      const reviews = JSON.parse(localStorage.getItem('bookReviews') || '[]');
      const years = new Set();
      reviews.forEach(r => {
        if (r['Start Date']) years.add(r['Start Date'].substring(0,4));
        if (r['End Date']) years.add(r['End Date'].substring(0,4));
      });
      return Array.from(years).sort();
    }

    function rebuildYearTabs() {
      const bar = document.getElementById('tabsBar');
      // Remove old year tabs
      bar.querySelectorAll('.year-tab').forEach(t => t.remove());
      document.querySelectorAll('.year-page').forEach(p => p.remove());

      getYearsFromReviews().forEach(year => {
        // Tab button
        const btn = document.createElement('button');
        btn.className = 'tab-btn year-tab';
        btn.dataset.tab = 'year-' + year;
        btn.textContent = year;
        btn.onclick = function() { showTab('year-' + year, this); };
        bar.appendChild(btn);

        // Page div
        const page = document.createElement('div');
        page.id = 'year-' + year;
        page.className = 'page year-page';
        page.innerHTML = `<div class="container"><h2>${year} Reading Gallery<\/h2><div class="gallery-grid" id="gallery-${year}"><\/div><\/div>`;
        document.body.appendChild(page);
      });
    }

    function renderGallery(year) {
      const reviews = JSON.parse(localStorage.getItem('bookReviews') || '[]');
      const filtered = reviews.filter(r =>
        (r['Start Date'] && r['Start Date'].startsWith(year)) ||
        (r['End Date'] && r['End Date'].startsWith(year))
      ).sort((a,b) => {
        const da = a['End Date'] || a['Start Date'] || '';
        const db = b['End Date'] || b['Start Date'] || '';
        return da.localeCompare(db);
      });

      const grid = document.getElementById('gallery-' + year);
      if (!grid) return;
      const TOTAL = 40; // 4 cols x 10 rows
      grid.innerHTML = '';
      for (let i = 0; i < TOTAL; i++) {
        const cell = document.createElement('div');
        if (i < filtered.length) {
          const r = filtered[i];
          cell.className = 'gallery-cell filled';
          const rIdx = reviews.findIndex(x => JSON.stringify(x) === JSON.stringify(r));
          cell.onclick = function() { openGpop(rIdx); };
          if (r.CoverURL) {
            cell.innerHTML = `<img src="${r.CoverURL}" alt="${r.Title}" onerror="this.style.display='none';this.nextSibling.style.display='flex';" />
              <div class="cell-title" style="display:none">${r.Title || ''}<\/div>
              <div class="gallery-cell-tooltip">${r.Title || ''}<\/div>`;
          } else {
            cell.innerHTML = `<div class="cell-title">${r.Title || ''}<\/div>
              <div class="gallery-cell-tooltip">${r.Author || ''}<\/div>`;
          }
        } else {
          cell.className = 'gallery-cell';
          cell.innerHTML = '<span class="cell-empty">+<\/span>';
        }
        grid.appendChild(cell);
      }
    }

    // ── Tab Navigation ──
    function showTab(tab, btnEl) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const page = document.getElementById(tab);
      if (page) page.classList.add('active');
      if (btnEl) btnEl.classList.add('active');
      activeTab = tab;
      if (tab === 'reviews') { currentPage = 1; renderReviews(); }
      if (tab.startsWith('year-')) { renderGallery(tab.replace('year-', '')); }
    }

    // ── Parse quotes: extract "..." blocks ──


    // ── Render Reviews ──
    function getFiltered() {
      const all = JSON.parse(localStorage.getItem('bookReviews') || '[]').slice().reverse();
      if (!searchQuery) return all;
      const q = searchQuery.toLowerCase();
      return all.filter(r =>
        (r.Title||'').toLowerCase().includes(q) ||
        (r.Author||'').toLowerCase().includes(q) ||
        (r.Summary||'').toLowerCase().includes(q) ||
        (r.Thoughts||'').toLowerCase().includes(q)
      );
    }

    function renderReviews() {
      const filtered = getFiltered();
      const container = document.getElementById('reviews-list');
      if (filtered.length === 0) {
        container.innerHTML = '<p id="no-reviews">No reviews found.<\/p>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      const totalPages = Math.ceil(filtered.length / PER_PAGE);
      if (currentPage > totalPages) currentPage = totalPages;
      const start = (currentPage - 1) * PER_PAGE;
      const slice = filtered.slice(start, start + PER_PAGE);
      const all = JSON.parse(localStorage.getItem('bookReviews') || '[]');

      container.innerHTML = slice.map(r => {
        const origIdx = all.findIndex(x => JSON.stringify(x) === JSON.stringify(r));
        const quotes = parseQuotes(r.Quotes);
        const quotesHTML = quotes.map(q => `<blockquote>${hlText(q, searchQuery)}<\/blockquote>`).join('');
        const coverHTML = r.CoverURL ? `<img src="${r.CoverURL}" style="max-height:100px;border-radius:6px;margin-bottom:0.6rem;border:1px solid #ddd;" onerror="this.style.display='none'" />` : '';
        return `
        <div class="review-card">
          <div class="card-actions">
            <button class="icon-btn" onclick="openEdit(${origIdx})" title="Edit">✏️<\/button>
            <button class="icon-btn del" onclick="deleteReview(${origIdx})" title="Delete">🗑️<\/button>
          <\/div>
          ${coverHTML}
          <h3>${hlText(r.Title||'Untitled', searchQuery)}<\/h3>
          <div class="meta">by ${hlText(r.Author||'', searchQuery)} &nbsp;·&nbsp; ${r.Format||''} &nbsp;·&nbsp; ${r['Start Date']||'?'} → ${r['End Date']||'?'}<\/div>
          <div class="stars-display">${r.Rating||''}<\/div>
          ${r.Summary ? `<p><strong>Summary:<\/strong> ${hlText(r.Summary, searchQuery)}<\/p>` : ''}
          ${r.Thoughts ? `<p><strong>Thoughts:<\/strong> ${hlText(r.Thoughts, searchQuery)}<\/p>` : ''}
          ${quotesHTML}
        <\/div>`;
      }).join('');

      const pg = document.getElementById('pagination');
      let btns = `<button onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Prev<\/button>`;
      for (let i = 1; i <= totalPages; i++)
        btns += `<button class="${i===currentPage?'active':''}" onclick="goPage(${i})">${i}<\/button>`;
      btns += `<button onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>Next ›<\/button>`;
      pg.innerHTML = btns;
    }

    function goPage(n) { currentPage = n; renderReviews(); window.scrollTo(0,0); }
    function onSearch() { searchQuery = document.getElementById('searchInput').value; currentPage = 1; renderReviews(); }

    function deleteReview(idx) {
      if (!confirm('Delete this review?')) return;
      const reviews = JSON.parse(localStorage.getItem('bookReviews') || '[]');
      reviews.splice(idx, 1);
      localStorage.setItem('bookReviews', JSON.stringify(reviews));
      rebuildYearTabs();
      renderReviews();
    }

    // ── Edit Modal ──
    function openEdit(idx) {
      const reviews = JSON.parse(localStorage.getItem('bookReviews') || '[]');
      const r = reviews[idx];
      document.getElementById('edit-idx').value = idx;
      document.getElementById('edit-Title').value = r.Title || '';
      document.getElementById('edit-CoverURL').value = r.CoverURL || '';
      document.getElementById('edit-Author').value = r.Author || '';
      document.getElementById('edit-Format').value = r.Format || 'Print';
      document.getElementById('edit-StartDate').value = r['Start Date'] || '';
      document.getElementById('edit-EndDate').value = r['End Date'] || '';
      document.getElementById('edit-Summary').value = r.Summary || '';
      document.getElementById('edit-Thoughts').value = r.Thoughts || '';
      document.getElementById('edit-Quotes').value = r.Quotes || '';
      // Set rating
      document.querySelectorAll('input[name="editRating"]').forEach(el => {
        el.checked = el.value === r.Rating;
      });
      document.getElementById('editModal').classList.add('open');
    }

    function closeModal() { document.getElementById('editModal').classList.remove('open'); }

    function saveEdit() {
      const idx = parseInt(document.getElementById('edit-idx').value);
      const reviews = JSON.parse(localStorage.getItem('bookReviews') || '[]');
      const ratingEl = document.querySelector('input[name="editRating"]:checked');
      const updated = {
        Title: document.getElementById('edit-Title').value,
        CoverURL: document.getElementById('edit-CoverURL').value,
        Author: document.getElementById('edit-Author').value,
        Rating: ratingEl ? ratingEl.value : '',
        Format: document.getElementById('edit-Format').value,
        'Start Date': document.getElementById('edit-StartDate').value,
        'End Date': document.getElementById('edit-EndDate').value,
        Summary: document.getElementById('edit-Summary').value,
        Thoughts: document.getElementById('edit-Thoughts').value,
        Quotes: document.getElementById('edit-Quotes').value,
      };
      reviews[idx] = updated;
      localStorage.setItem('bookReviews', JSON.stringify(reviews));
      closeModal();
      rebuildYearTabs();
      renderReviews();

      // Sync to Sheets as new entry
      const params = new URLSearchParams(updated).toString();
      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params, mode: 'no-cors', redirect: 'follow'
      });
    }

    // ── Form Submit ──
    document.getElementById('reviewForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const status = document.getElementById('status');
      status.textContent = '💾 Saving...';
      const data = new FormData(this);
      const entry = Object.fromEntries(data.entries());
      const reviews = JSON.parse(localStorage.getItem('bookReviews') || '[]');
      reviews.push(entry);
      localStorage.setItem('bookReviews', JSON.stringify(reviews));
      rebuildYearTabs();

      const params = new URLSearchParams(entry).toString();
      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params, mode: 'no-cors', redirect: 'follow'
      })
        .then(() => { status.textContent = '✅ Review saved!'; })
        .catch(() => { status.textContent = '⚠️ Saved locally. Sheets sync failed.'; });
      this.reset();
      document.getElementById('cover-preview').style.display = 'none';
    });

    // ── Init ──
    rebuildYearTabs();
  
    function hlText(text, q) {
      if (!text) return text;
      var d = document.createElement('div');
      d.appendChild(document.createTextNode(text));
      var safe = d.innerHTML;
      if (!q) return safe;
      var lower = safe.toLowerCase();
      var ql = q.toLowerCase();
      var result = '';
      var i = 0;
      while (i < safe.length) {
        var pos = lower.indexOf(ql, i);
        if (pos === -1) { result += safe.slice(i); break; }
        result += safe.slice(i, pos) + '<mark>' + safe.slice(pos, pos + q.length) + '</mark>';
        i = pos + q.length;
      }
      return result;
    }

    function parseQuotes(raw) {
      if (!raw) return [];
      var results = [];
      var s = raw;
      var openChars  = ['"', '“', '‘'];
      var closeChars = ['"', '”', '’'];
      var i = 0;
      while (i < s.length) {
        var openIdx = -1;
        var closeChar = '';
        for (var oi = 0; oi < openChars.length; oi++) {
          var tmp = s.indexOf(openChars[oi], i);
          if (tmp !== -1 && (openIdx === -1 || tmp < openIdx)) {
            openIdx = tmp;
            closeChar = closeChars[oi];
          }
        }
        if (openIdx === -1) break;
        var closeIdx = s.indexOf(closeChar, openIdx + 1);
        if (closeIdx === -1) break;
        var q = s.slice(openIdx + 1, closeIdx).trim();
        if (q) results.push(q);
        i = closeIdx + 1;
      }
      return results;
    }

    function openGpop(idx) {
      var all = JSON.parse(localStorage.getItem('bookReviews') || '[]');
      var r = all[idx];
      if (!r) return;
      var box = document.getElementById('gpopBody');
      box.innerHTML = '';

      if (r.CoverURL) {
        var img = document.createElement('img');
        img.src = r.CoverURL;
        box.appendChild(img);
      }
      var h3 = document.createElement('h3');
      h3.textContent = r.Title || '';
      box.appendChild(h3);

      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = 'by ' + (r.Author||'') + ' · ' + (r.Format||'') + ' · ' + (r['Start Date']||'?') + ' → ' + (r['End Date']||'?');
      box.appendChild(meta);

      var stars = document.createElement('div');
      stars.className = 'stars-display';
      stars.textContent = r.Rating || '';
      box.appendChild(stars);

      if (r.Summary) {
        var p1 = document.createElement('p');
        p1.innerHTML = '<strong>Summary:<\/strong> ' + r.Summary;
        box.appendChild(p1);
      }
      if (r.Thoughts) {
        var p2 = document.createElement('p');
        p2.innerHTML = '<strong>Thoughts:<\/strong> ' + r.Thoughts;
        box.appendChild(p2);
      }
      var quotes = parseQuotes(r.Quotes);
      for (var qi = 0; qi < quotes.length; qi++) {
        var bq = document.createElement('blockquote');
        bq.textContent = quotes[qi];
        box.appendChild(bq);
      }
      document.getElementById('gpopOverlay').classList.add('open');
    }

    function closeGpop() {
      document.getElementById('gpopOverlay').classList.remove('open');
    }

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('gpopOverlay').addEventListener('click', function(e) {
        if (e.target === this) closeGpop();
      });
      document.getElementById('gpopClose').addEventListener('click', closeGpop);
    });
</script>

<div class="gpop-overlay" id="gpopOverlay">
  <div class="gpop" id="gpopBox">
    <button class="gpop-close" id="gpopClose">&#x2715;</button>
    <div id="gpopBody"></div>
  </div>
</div>
</body>
</html>
