<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📚 My Book Reviews</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background: #fdf8f2; color: #333; }

    /* ── Tabs ── */
    .tabs { display: flex; padding: 1.5rem 2rem 0; gap: 0; max-width: 800px; margin: 0 auto; }
    .tab-btn {
      padding: 0.6rem 1.6rem; border: 1px solid #c9a97a; border-bottom: none;
      background: #ede0ce; cursor: pointer; font-family: Georgia, serif;
      font-size: 0.95rem; color: #7a5c40; border-radius: 8px 8px 0 0;
      margin-right: 4px; transition: background 0.2s;
    }
    .tab-btn.active { background: #fff; color: #5a3e2b; font-weight: bold; }
    .tab-btn:hover:not(.active) { background: #f5ebe0; }

    /* ── Pages ── */
    .page { display: none; }
    .page.active { display: block; }
    .container {
      max-width: 800px; margin: 0 auto; padding: 2rem;
      background: #fff; border: 1px solid #c9a97a;
      border-radius: 0 8px 8px 8px; min-height: 60vh;
    }

    /* ── Form ── */
    h1 { font-size: 1.8rem; margin-bottom: 1.5rem; color: #5a3e2b; }
    form { max-width: 680px; }
    label { display: block; font-size: 0.85rem; font-weight: bold; margin: 1rem 0 0.3rem; color: #5a3e2b; }
    input, select, textarea {
      width: 100%; padding: 0.6rem 0.8rem; border: 1px solid #ddd;
      border-radius: 8px; font-size: 1rem; font-family: inherit; background: #fafafa;
    }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .stars { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 4px; margin-top: 0.3rem; }
    .stars input { display: none; }
    .stars label {
      font-size: 1.8rem; cursor: pointer; color: #ccc;
      border: none; background: none; padding: 0; margin: 0; width: auto;
    }
    .stars input:checked ~ label,
    .stars label:hover,
    .stars label:hover ~ label { color: #f5a623; }

    button[type="submit"] {
      margin-top: 1.5rem; width: 100%; padding: 0.8rem;
      background: #5a3e2b; color: white; font-size: 1rem;
      border: none; border-radius: 8px; cursor: pointer; font-family: inherit;
    }
    button[type="submit"]:hover { background: #7a5c40; }
    #status { text-align: center; margin-top: 0.8rem; font-size: 0.9rem; color: green; }

    /* ── Search Bar ── */
    .search-wrap { margin-bottom: 1.5rem; }
    .search-wrap input {
      width: 100%; padding: 0.7rem 1rem; border-radius: 8px;
      border: 1px solid #c9a97a; font-size: 1rem; font-family: inherit;
    }

    /* ── Review Cards ── */
    h2 { color: #5a3e2b; margin-bottom: 1rem; font-size: 1.4rem; }
    .review-card {
      position: relative; background: #fdf8f2; border-radius: 12px;
      padding: 1.4rem 1.4rem 1.4rem 1.4rem;
      margin-bottom: 1.2rem; border: 1px solid #e8d8c4;
    }
    .review-card h3 { font-size: 1.15rem; color: #5a3e2b; padding-right: 2rem; }
    .review-card .meta { font-size: 0.82rem; color: #999; margin: 0.3rem 0 0.6rem; }
    .review-card .stars-display { color: #f5a623; font-size: 1rem; margin-bottom: 0.5rem; }
    .review-card p { font-size: 0.93rem; margin-top: 0.4rem; line-height: 1.6; }
    .review-card blockquote {
      border-left: 3px solid #f5a623; padding-left: 1rem;
      margin-top: 0.8rem; font-style: italic; color: #777; font-size: 0.9rem;
    }
    .delete-btn {
      position: absolute; top: 0.9rem; right: 0.9rem;
      background: none; border: none; cursor: pointer;
      font-size: 1.1rem; color: #bbb; transition: color 0.2s;
      padding: 2px 4px; line-height: 1;
    }
    .delete-btn:hover { color: #c0392b; }

    /* ── Pagination ── */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-top: 1.5rem; }
    .pagination button {
      padding: 0.4rem 0.9rem; border: 1px solid #c9a97a; background: #fff;
      border-radius: 6px; cursor: pointer; font-family: inherit; color: #5a3e2b;
    }
    .pagination button.active { background: #5a3e2b; color: #fff; border-color: #5a3e2b; }
    .pagination button:disabled { opacity: 0.4; cursor: default; }
    #no-reviews { color: #aaa; font-style: italic; }
  </style>
</head>
<body>

  <div style="max-width:800px; margin:0 auto; padding: 1.5rem 2rem 0;">
    <h1 style="font-size:2rem; color:#5a3e2b; margin-bottom:1rem;">📚 My Book Reviews</h1>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('home')">Home</button>
    <button class="tab-btn" onclick="showTab('reviews')">All Reviews</button>
  </div>

  <!-- Home Page -->
  <div id="home" class="page active">
    <div class="container">
      <form id="reviewForm">
        <label>Title</label>
        <input name="Title" required placeholder="e.g. Pride and Prejudice" />

        <label>Author</label>
        <input name="Author" required placeholder="e.g. Jane Austen" />

        <label>Rating</label>
        <div class="stars">
          <input type="radio" name="Rating" id="s5" value="⭐⭐⭐⭐⭐"/><label for="s5">★</label>
          <input type="radio" name="Rating" id="s4" value="⭐⭐⭐⭐"/><label for="s4">★</label>
          <input type="radio" name="Rating" id="s3" value="⭐⭐⭐"/><label for="s3">★</label>
          <input type="radio" name="Rating" id="s2" value="⭐⭐"/><label for="s2">★</label>
          <input type="radio" name="Rating" id="s1" value="⭐"/><label for="s1">★</label>
        </div>

        <label>Format</label>
        <select name="Format">
          <option value="Print">📖 Print</option>
          <option value="Audio">🎧 Audiobook</option>
          <option value="eBook">📱 eBook</option>
        </select>

        <div class="row">
          <div><label>Start Date</label><input name="Start Date" type="date"/></div>
          <div><label>End Date</label><input name="End Date" type="date"/></div>
        </div>

        <label>Summary</label>
        <textarea name="Summary" placeholder="What is the book about?"></textarea>

        <label>My Thoughts</label>
        <textarea name="Thoughts" placeholder="Your personal reflection..."></textarea>

        <label>Favorite Quotes</label>
        <textarea name="Quotes" placeholder="Notable passages..."></textarea>

        <button type="submit">Save Review</button>
        <div id="status"></div>
      </form>
    </div>
  </div>

  <!-- All Reviews Page -->
  <div id="reviews" class="page">
    <div class="container">
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="🔍 Search by title, author, or keyword..." oninput="onSearch()" />
      </div>
      <div id="reviews-list"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxoYnHVYOTRg3ttWnFkitldJYy694xSjqOgn_4veQq657d44vpqfI-oyFWKJka5WSgzSA/exec';
    const PER_PAGE = 3;
    let currentPage = 1;
    let searchQuery = '';

    // ── Tab Navigation ──
    function showTab(tab) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
      if (tab === 'reviews') { currentPage = 1; renderReviews(); }
    }

    // ── Get filtered reviews ──
    function getFiltered() {
      const all = JSON.parse(localStorage.getItem('bookReviews') || '[]').slice().reverse();
      if (!searchQuery) return all;
      const q = searchQuery.toLowerCase();
      return all.filter(r =>
        (r.Title || '').toLowerCase().includes(q) ||
        (r.Author || '').toLowerCase().includes(q) ||
        (r.Summary || '').toLowerCase().includes(q) ||
        (r.Thoughts || '').toLowerCase().includes(q)
      );
    }

    // ── Render Reviews ──
    function renderReviews() {
      const filtered = getFiltered();
      const container = document.getElementById('reviews-list');
      if (filtered.length === 0) {
        container.innerHTML = '<p id="no-reviews">No reviews found.</p>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      const totalPages = Math.ceil(filtered.length / PER_PAGE);
      if (currentPage > totalPages) currentPage = totalPages;
      const start = (currentPage - 1) * PER_PAGE;
      const slice = filtered.slice(start, start + PER_PAGE);

      // Get original indices for deletion (from un-reversed full array)
      const all = JSON.parse(localStorage.getItem('bookReviews') || '[]');

      container.innerHTML = slice.map(r => {
        const origIdx = all.indexOf(r) !== -1
          ? all.findIndex(x => JSON.stringify(x) === JSON.stringify(r))
          : -1;
        return `
        <div class="review-card">
          <button class="delete-btn" onclick="deleteReview(${origIdx})" title="Delete review">🗑️</button>
          <h3>${r.Title || 'Untitled'}</h3>
          <div class="meta">by ${r.Author || '?'} &nbsp;·&nbsp; ${r.Format || ''} &nbsp;·&nbsp; ${r['Start Date'] || '?'} → ${r['End Date'] || '?'}</div>
          <div class="stars-display">${r.Rating || ''}</div>
          ${r.Summary ? `<p><strong>Summary:</strong> ${r.Summary}</p>` : ''}
          ${r.Thoughts ? `<p><strong>Thoughts:</strong> ${r.Thoughts}</p>` : ''}
          ${r.Quotes ? `<blockquote>${r.Quotes}</blockquote>` : ''}
        </div>`;
      }).join('');

      // Pagination
      const pg = document.getElementById('pagination');
      let btns = '';
      btns += `<button onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Prev</button>`;
      for (let i = 1; i <= totalPages; i++) {
        btns += `<button class="${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      }
      btns += `<button onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>Next ›</button>`;
      pg.innerHTML = btns;
    }

    function goPage(n) { currentPage = n; renderReviews(); window.scrollTo(0,0); }

    function onSearch() {
      searchQuery = document.getElementById('searchInput').value;
      currentPage = 1;
      renderReviews();
    }

    // ── Delete Review ──
    function deleteReview(idx) {
      if (!confirm('Delete this review?')) return;
      const reviews = JSON.parse(localStorage.getItem('bookReviews') || '[]');
      reviews.splice(idx, 1);
      localStorage.setItem('bookReviews', JSON.stringify(reviews));
      renderReviews();
    }

    // ── Form Submit ──
    document.getElementById('reviewForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const status = document.getElementById('status');
      status.textContent = '💾 Saving...';
      const data = new FormData(this);
      const entry = Object.fromEntries(data.entries());

      const reviews = JSON.parse(localStorage.getItem('bookReviews') || '[]');
      reviews.push(entry);
      localStorage.setItem('bookReviews', JSON.stringify(reviews));

      const params = new URLSearchParams(entry).toString();
      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params,
        mode: 'no-cors',
        redirect: 'follow'
      })
        .then(() => { status.textContent = '✅ Review saved!'; })
        .catch(() => { status.textContent = '⚠️ Saved locally. Sheets sync failed.'; });

      this.reset();
    });
  </script>
</body>
</html>
